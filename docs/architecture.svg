<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Coding RL</title><desc id="desc">Task adapters, rollout routes, verification and policy updates share one training pipeline.. Configured generation capacity and optimizer batch size are independent. Public runtime compatibility is documented separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8996ab" stroke-width="1.3"/></marker></defs>
<rect width="1440" height="550" rx="22" fill="#f6f8fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#18243a}.sub{font-size:17px;fill:#53627b}.heading{font-size:20px;font-weight:700;fill:#18243a}.body{font-size:17px;fill:#44536a}.label{font-size:15px;font-weight:700;letter-spacing:1px}</style>
<text x="36" y="48" class="title">Multimodal Coding RL</text>
<text x="36" y="80" class="sub">Task adapters, rollout routes, verification and policy updates share one training pipeline.</text>
<text x="36" y="116" class="label" fill="#087f8c">01 / GENERATE</text>
<rect x="36.0" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="144" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="54.0" y="163" class="heading">Canonical task</text>
<text x="54.0" y="192" class="body">Prompt + allowed input assets</text>
<text x="54.0" y="215" class="body">Stable task and prompt IDs</text>
<text x="54.0" y="238" class="body">Private judge references held back</text>
<path d="M475.6666666666667 198 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="144" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="520.6666666666667" y="163" class="heading">Route the prompt</text>
<text x="520.6666666666667" y="192" class="body">Single-turn or agentic</text>
<text x="520.6666666666667" y="215" class="body">OpenCode / Codex / Hermes</text>
<text x="520.6666666666667" y="238" class="body">Group or sibling-level assignment</text>
<path d="M942.3333333333334 198 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="144" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="987.3333333333334" y="163" class="heading">Capture the rollout</text>
<text x="987.3333333333334" y="192" class="body">Model tokens and behavior logprobs</text>
<text x="987.3333333333334" y="215" class="body">Tool calls and terminal artifacts</text>
<text x="987.3333333333334" y="238" class="body">Request lineage and stop reason</text>
<text x="36" y="301" class="label" fill="#7357c7">02 / VERIFY AND LEARN</text>
<rect x="36.0" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="54.0" y="348" class="heading">Independent verification</text>
<text x="54.0" y="377" class="body">Execute in the configured sandbox</text>
<text x="54.0" y="400" class="body">Render images, animations or 3D</text>
<text x="54.0" y="423" class="body">Apply the task-specific verifier</text>
<path d="M475.6666666666667 383 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="520.6666666666667" y="348" class="heading">Reward and eligibility</text>
<text x="520.6666666666667" y="377" class="body">Raw reward + configured penalties</text>
<text x="520.6666666666667" y="400" class="body">Separate model and service failures</text>
<text x="520.6666666666667" y="423" class="body">Apply truncation / validity masks</text>
<path d="M942.3333333333334 383 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="987.3333333333334" y="348" class="heading">NeMo RL update</text>
<text x="987.3333333333334" y="377" class="body">Assemble complete prompt groups</text>
<text x="987.3333333333334" y="400" class="body">Compute advantages and policy loss</text>
<text x="987.3333333333334" y="423" class="body">Checkpoint, metrics and recovery</text>
<text x="36" y="525" class="sub">Configured generation capacity and optimizer batch size are independent. Public runtime compatibility is documented separately.</text>
</svg>
