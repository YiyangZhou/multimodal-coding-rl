<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">Mixed rollout</title><desc id="desc">Two routing strategies share task adapters, reward contracts and a single trainable policy.. Route support is task-specific. Ready-first scheduling selects complete groups; it does not select answers by reward.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8996ab" stroke-width="1.3"/></marker></defs>
<rect width="1440" height="550" rx="22" fill="#f6f8fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#18243a}.sub{font-size:17px;fill:#53627b}.heading{font-size:20px;font-weight:700;fill:#18243a}.body{font-size:17px;fill:#44536a}.label{font-size:15px;font-weight:700;letter-spacing:1px}</style>
<text x="36" y="48" class="title">Mixed rollout</text>
<text x="36" y="80" class="sub">Two routing strategies share task adapters, reward contracts and a single trainable policy.</text>
<text x="36" y="116" class="label" fill="#3268bb">A / PROMPT-GROUP ROUTING</text>
<rect x="36.0" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="144" width="4" height="28" rx="2" fill="#3268bb"/>
<text x="54.0" y="163" class="heading">Select a prompt group</text>
<text x="54.0" y="192" class="body">Sample from the configured task mix</text>
<text x="54.0" y="215" class="body">Choose one permitted route</text>
<text x="54.0" y="238" class="body">Keep the route stable on retry</text>
<path d="M475.6666666666667 198 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="144" width="4" height="28" rx="2" fill="#3268bb"/>
<text x="520.6666666666667" y="163" class="heading">Generate siblings</text>
<text x="520.6666666666667" y="192" class="body">All siblings use the selected route</text>
<text x="520.6666666666667" y="215" class="body">Direct or one supported harness</text>
<text x="520.6666666666667" y="238" class="body">Preserve common prompt identity</text>
<path d="M942.3333333333334 198 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="144" width="4" height="28" rx="2" fill="#3268bb"/>
<text x="987.3333333333334" y="163" class="heading">Complete the group</text>
<text x="987.3333333333334" y="192" class="body">Verify each terminal artifact</text>
<text x="987.3333333333334" y="215" class="body">Apply validity and length rules</text>
<text x="987.3333333333334" y="238" class="body">Submit an eligible complete group</text>
<text x="36" y="301" class="label" fill="#7357c7">B / SAME-PROMPT SIBLING ROUTING</text>
<rect x="36.0" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="54.0" y="348" class="heading">One prompt, eight siblings</text>
<text x="54.0" y="377" class="body">2 × single-turn</text>
<text x="54.0" y="400" class="body">2 × OpenCode</text>
<text x="54.0" y="423" class="body">2 × Codex + 2 × Hermes</text>
<path d="M475.6666666666667 383 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="520.6666666666667" y="348" class="heading">Execute all four routes</text>
<text x="520.6666666666667" y="377" class="body">Stable sibling-to-route assignment</text>
<text x="520.6666666666667" y="400" class="body">Each route uses its own tool flow</text>
<text x="520.6666666666667" y="423" class="body">Same underlying trainable policy</text>
<path d="M942.3333333333334 383 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="329" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="987.3333333333334" y="348" class="heading">One grouped update stream</text>
<text x="987.3333333333334" y="377" class="body">Common reward contract</text>
<text x="987.3333333333334" y="400" class="body">Compare eligible sibling outcomes</text>
<text x="987.3333333333334" y="423" class="body">Log task and route breakdowns</text>
<text x="36" y="525" class="sub">Route support is task-specific. Ready-first scheduling selects complete groups; it does not select answers by reward.</text>
</svg>
