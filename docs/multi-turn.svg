<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">Agentic rollout</title><desc id="desc">The selected harness controls the tool loop; the model remains the trainable policy.. Tool feedback belongs to the rollout context. Final verification supplies the reward; it does not rewrite the model answer.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8996ab" stroke-width="1.3"/></marker></defs>
<rect width="1440" height="550" rx="22" fill="#f6f8fc"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:30px;font-weight:700;fill:#18243a}.sub{font-size:17px;fill:#53627b}.heading{font-size:20px;font-weight:700;fill:#18243a}.body{font-size:17px;fill:#44536a}.label{font-size:15px;font-weight:700;letter-spacing:1px}</style>
<text x="36" y="48" class="title">Agentic rollout</text>
<text x="36" y="80" class="sub">The selected harness controls the tool loop; the model remains the trainable policy.</text>
<text x="36" y="116" class="label" fill="#7357c7">01 / INTERACTION LOOP</text>
<rect x="36.0" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="144" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="54.0" y="163" class="heading">Choose a harness</text>
<text x="54.0" y="192" class="body">OpenCode, Codex or Hermes</text>
<text x="54.0" y="215" class="body">Task prompt + sandbox workspace</text>
<text x="54.0" y="238" class="body">Configured call and token budgets</text>
<path d="M475.6666666666667 198 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="144" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="520.6666666666667" y="163" class="heading">Model ↔ tools</text>
<text x="520.6666666666667" y="192" class="body">Model proposes code or actions</text>
<text x="520.6666666666667" y="215" class="body">Harness executes permitted tools</text>
<text x="520.6666666666667" y="238" class="body">Observations inform the next call</text>
<path d="M942.3333333333334 198 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="132" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="144" width="4" height="28" rx="2" fill="#7357c7"/>
<text x="987.3333333333334" y="163" class="heading">Finalize the artifact</text>
<text x="987.3333333333334" y="192" class="body">Stop on completion or budget</text>
<text x="987.3333333333334" y="215" class="body">Keep code and interaction history</text>
<text x="987.3333333333334" y="238" class="body">Record the terminal status</text>
<text x="36" y="301" class="label" fill="#087f8c">02 / TRAINING CONTRACT</text>
<rect x="36.0" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="36.0" y="329" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="54.0" y="348" class="heading">Capture each model call</text>
<text x="54.0" y="377" class="body">Exact tokens + behavior logprobs</text>
<text x="54.0" y="400" class="body">Preserve request / response lineage</text>
<text x="54.0" y="423" class="body">Separate tool observations</text>
<path d="M475.6666666666667 383 H495.6666666666667" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.6666666666667" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="502.6666666666667" y="329" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="520.6666666666667" y="348" class="heading">Verify final output</text>
<text x="520.6666666666667" y="377" class="body">Independent task execution</text>
<text x="520.6666666666667" y="400" class="body">Render and score final artifacts</text>
<text x="520.6666666666667" y="423" class="body">Classify infrastructure failures</text>
<path d="M942.3333333333334 383 H962.3333333333334" stroke="#8996ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="969.3333333333334" y="317" width="434.6666666666667" height="132" rx="12" fill="white" stroke="#dce3ee"/>
<rect x="969.3333333333334" y="329" width="4" height="28" rx="2" fill="#087f8c"/>
<text x="987.3333333333334" y="348" class="heading">Build policy samples</text>
<text x="987.3333333333334" y="377" class="body">Train on eligible model tokens</text>
<text x="987.3333333333334" y="400" class="body">Tool-output tokens are not targets</text>
<text x="987.3333333333334" y="423" class="body">Group rewards feed advantages</text>
<text x="36" y="525" class="sub">Tool feedback belongs to the rollout context. Final verification supplies the reward; it does not rewrite the model answer.</text>
</svg>
